name: Build Nūr Offline APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Validate the embedded offline library
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/data/quran-data.js
          node --check app/src/main/assets/app.js
          node scripts/verify-local-package.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle clean assembleDebug --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nur-Android-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
